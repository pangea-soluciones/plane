# Despliegue automático al hacer push a main:
# - Construye en GitHub Actions y publica en ECR (sin compilar en el servidor; adecuado para instancias pequeñas, p. ej. Lightsail 2 GB).
# - Imágenes: plane-api, plane-web, plane-proxy. Crea los tres repositorios en ECR (us-east-1) si no existen.
# - Tras el push a ECR: SSH al servidor para docker compose pull/up (salvo que desactives el job).
#
# Secretos (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY — permisos ECR para push (p. ej. ecr:BatchCheckLayerAvailability, PutImage, …).
#   DEPLOY_SSH_PRIVATE_KEY — clave privada PEM para SSH al EC2 (obligatoria para que el despliegue tenga éxito).
#
# Variables:
#   ENABLE_EC2_DEPLOY — pon "false" para omitir por completo el job de despliegue por SSH (por defecto se ejecuta).
#   DEPLOY_HOST — por defecto 3.80.135.252 si no defines la variable.
#   DEPLOY_USER — SSH (por defecto ubuntu).
#   DEPLOY_WORKDIR — carpeta del compose en el servidor (por defecto $HOME/plane del usuario SSH, p. ej. /home/ubuntu/plane).
#   DEPLOY_COMPOSE_FLAGS — opcional; por defecto -f docker-compose.yml -f docker-compose.ecr-override.yml
#   VITE_API_BASE_URL, VITE_WEB_BASE_URL — por defecto https://plane-api.yomogo.io y https://plane-web.yomogo.io
#     (sobrescribibles con variables del repo).
#   VITE_ADMIN_BASE_URL, VITE_SPACE_BASE_URL, VITE_LIVE_BASE_URL — opcionales si despliegas admin/space/live.
#
# En el servidor: variables según compose oficial (WEB_URL, CORS_ALLOWED_ORIGINS, CERT_EMAIL, APP_DOMAIN). Ver deployments/ec2/env.example.
# Si el override ECR en el servidor es viejo (solo api/web), bórralo para que se regenere o copia deployments/ec2/docker-compose.ecr-override.yml.
#
# En el EC2: Docker y Docker Compose v2. El login a ECR se hace con un token generado en GitHub (mismas credenciales que el push), sin IAM ECR en la instancia.

name: Deploy main → ECR + servidor

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main-ecr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 396608806728.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-push-api:
    name: Build y push plane-api
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/plane-api:main
            ${{ env.ECR_REGISTRY }}/plane-api:${{ github.sha }}

  build-push-web:
    name: Build y push plane-web
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://plane-api.yomogo.io' }}
            VITE_WEB_BASE_URL=${{ vars.VITE_WEB_BASE_URL || 'https://plane-web.yomogo.io' }}
            VITE_ADMIN_BASE_URL=${{ vars.VITE_ADMIN_BASE_URL }}
            VITE_LIVE_BASE_URL=${{ vars.VITE_LIVE_BASE_URL }}
            VITE_SPACE_BASE_URL=${{ vars.VITE_SPACE_BASE_URL }}
          tags: |
            ${{ env.ECR_REGISTRY }}/plane-web:main
            ${{ env.ECR_REGISTRY }}/plane-web:${{ github.sha }}

  build-push-proxy:
    name: Build y push plane-proxy (Caddy)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push proxy CE
        uses: docker/build-push-action@v6
        with:
          context: ./apps/proxy
          file: ./apps/proxy/Dockerfile.ce
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/plane-proxy:main
            ${{ env.ECR_REGISTRY }}/plane-proxy:${{ github.sha }}

  deploy-ec2:
    name: Desplegar en EC2
    needs: [build-push-api, build-push-web, build-push-proxy]
    runs-on: ubuntu-22.04
    # Sin variable o distinta de "false": despliega por SSH. Requiere DEPLOY_SSH_PRIVATE_KEY; el token ECR sale del runner (no hace falta AWS CLI ni rol ECR en el servidor).
    if: ${{ vars.ENABLE_EC2_DEPLOY != 'false' }}
    steps:
      - name: Credenciales AWS en el runner (mismas que el push a ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Token ECR para docker login en el servidor
        run: |
          TOKEN=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")
          echo "::add-mask::$TOKEN"
          echo "ECR_DOCKER_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: SSH — docker login ECR, pull y compose up
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_WORKDIR: ${{ vars.DEPLOY_WORKDIR }}
          DEPLOY_COMPOSE_FLAGS: ${{ vars.DEPLOY_COMPOSE_FLAGS }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_DOCKER_PASSWORD: ${{ env.ECR_DOCKER_PASSWORD }}
        with:
          host: ${{ vars.DEPLOY_HOST || '3.80.135.252' }}
          username: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: DEPLOY_WORKDIR,DEPLOY_COMPOSE_FLAGS,ECR_REGISTRY,ECR_DOCKER_PASSWORD
          script: |
            set -euo pipefail
            WORKDIR="${DEPLOY_WORKDIR:-$HOME/plane}"
            mkdir -p "$WORKDIR"
            echo "$ECR_DOCKER_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            cd "$WORKDIR"
            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: No hay docker-compose.yml en $WORKDIR"
              echo "Copia el compose base de Plane (deployments/cli/community/docker-compose.yml). El override ECR se genera solo si falta."
              exit 1
            fi
            OVERRIDE="${WORKDIR}/docker-compose.ecr-override.yml"
            if [ ! -f "$OVERRIDE" ]; then
              echo "Generando $OVERRIDE (imágenes ${{ env.ECR_REGISTRY }})"
              printf '%s\n' \
                "services:" \
                "  api:" \
                "    image: ${{ env.ECR_REGISTRY }}/plane-api:main" \
                "" \
                "  worker:" \
                "    image: ${{ env.ECR_REGISTRY }}/plane-api:main" \
                "" \
                "  beat-worker:" \
                "    image: ${{ env.ECR_REGISTRY }}/plane-api:main" \
                "" \
                "  migrator:" \
                "    image: ${{ env.ECR_REGISTRY }}/plane-api:main" \
                "" \
                "  web:" \
                "    image: ${{ env.ECR_REGISTRY }}/plane-web:main" \
                "" \
                "  proxy:" \
                "    image: ${{ env.ECR_REGISTRY }}/plane-proxy:main" \
                "    depends_on:" \
                "      - api" \
                "      - web" \
                > "$OVERRIDE"
            fi
            DEFAULT_FLAGS="-f docker-compose.yml -f docker-compose.ecr-override.yml"
            if [ -n "${DEPLOY_COMPOSE_FLAGS:-}" ]; then
              FLAGS="$DEPLOY_COMPOSE_FLAGS"
            else
              FLAGS="$DEFAULT_FLAGS"
            fi
            # Stack mínimo CE: cola, minio, backend (api+workers), web, proxy. Migraciones antes del up.
            docker compose $FLAGS pull api web worker beat-worker migrator proxy plane-mq plane-minio || docker compose $FLAGS pull
            docker compose $FLAGS run --rm migrator
            docker compose $FLAGS up -d plane-db plane-redis plane-mq plane-minio api worker beat-worker web proxy
