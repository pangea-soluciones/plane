# Traefik v3: TLS con Let's Encrypt (ACME HTTP-01 sobre el puerto 80).
# No uses redirección global en :80 (rompe /.well-known/acme-challenge); aquí se redirige por router.
#
# En el servidor (mismo directorio que los otros compose):
#   docker compose -f docker-compose.yml -f docker-compose.ecr-override.yml -f docker-compose.traefik.yml up -d
# o exporta:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ecr-override.yml:docker-compose.traefik.yml
#
# .env (mínimo):
#   ACME_EMAIL=correo-valido@yomogo.io
#   PLANE_API_HOST=plane-api.yomogo.io
#   PLANE_WEB_HOST=plane-web.yomogo.io
# Opcional: COMPOSE_PROJECT_NAME=plane  (la red será ${COMPOSE_PROJECT_NAME}_default)

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?define ACME_EMAIL in .env for Let's Encrypt}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    command:
      - --log.level=INFO
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

  api:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-plane}_default
      - traefik.http.services.plane-api.loadbalancer.server.port=8000
      - "traefik.http.routers.plane-api-secure.rule=Host(`${PLANE_API_HOST:-plane-api.yomogo.io}`)"
      - traefik.http.routers.plane-api-secure.entrypoints=websecure
      - traefik.http.routers.plane-api-secure.tls=true
      - traefik.http.routers.plane-api-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.plane-api-secure.service=plane-api
      - traefik.http.middlewares.plane-api-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.plane-api-redirect.redirectscheme.permanent=true
      - "traefik.http.routers.plane-api-http.rule=Host(`${PLANE_API_HOST:-plane-api.yomogo.io}`) && !PathPrefix(`/.well-known/acme-challenge`)"
      - traefik.http.routers.plane-api-http.entrypoints=web
      - traefik.http.routers.plane-api-http.middlewares=plane-api-redirect
      - traefik.http.routers.plane-api-http.service=noop@internal

  web:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-plane}_default
      - traefik.http.services.plane-web.loadbalancer.server.port=3000
      - "traefik.http.routers.plane-web-secure.rule=Host(`${PLANE_WEB_HOST:-plane-web.yomogo.io}`)"
      - traefik.http.routers.plane-web-secure.entrypoints=websecure
      - traefik.http.routers.plane-web-secure.tls=true
      - traefik.http.routers.plane-web-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.plane-web-secure.service=plane-web
      - traefik.http.middlewares.plane-web-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.plane-web-redirect.redirectscheme.permanent=true
      - "traefik.http.routers.plane-web-http.rule=Host(`${PLANE_WEB_HOST:-plane-web.yomogo.io}`) && !PathPrefix(`/.well-known/acme-challenge`)"
      - traefik.http.routers.plane-web-http.entrypoints=web
      - traefik.http.routers.plane-web-http.middlewares=plane-web-redirect
      - traefik.http.routers.plane-web-http.service=noop@internal

  proxy:
    profiles:
      - plane-builtin-proxy

volumes:
  traefik_letsencrypt:
