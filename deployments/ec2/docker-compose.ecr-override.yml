# Sobrescribe imágenes del backend para ECR (misma imagen que api en worker/beat/migrator).
# Ajusta el proxy para que no exija space/admin/live si solo despliegas web + api.
#
#   docker compose -f docker-compose.yml -f docker-compose.ecr-override.yml up -d

services:
  api:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-api:main

  worker:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-api:main

  beat-worker:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-api:main

  migrator:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-api:main

  web:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-web:main

  # Imagen Caddy CE construida en CI y subida a ECR (workflow deploy-main-ecr.yml).
  proxy:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-proxy:main
    depends_on:
      - api
      - web
