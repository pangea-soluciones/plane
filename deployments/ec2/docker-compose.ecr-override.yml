# Sobrescribe las imágenes de api y web para usar tu ECR.
# El TLS y el enrutamiento los gestiona el servicio `proxy` del compose oficial de Plane (Caddy / plane-proxy).
# Ejemplo:
#   docker compose -f docker-compose.yml -f docker-compose.ecr-override.yml up -d
#
# Etiqueta "main" coincide con el workflow deploy-main-ecr.yml (también se publica el SHA del commit).

services:
  api:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-api:main

  web:
    image: 396608806728.dkr.ecr.us-east-1.amazonaws.com/plane-web:main
